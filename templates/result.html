<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Result | MatchMatrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icons/favicon.png') }}">
  <style>
    .glass {
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .scrollable {
      max-height: 400px;
      overflow-y: auto;
    }

    .chart-img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 text-gray-800">

  <div class="container mx-auto py-10 px-4">

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8">
      <h2 class="text-3xl font-bold text-white mb-4 md:mb-0">Final Resume Match Dashboard</h2>
      <a href="/"
        class="px-5 py-2 rounded-lg bg-white/30 hover:bg-white/50 text-white font-semibold shadow transition">🔁 Try Another</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">

      <!-- Left: Section-wise Scores -->
      <div class="md:col-span-3 flex flex-col">
        <div class="glass rounded-2xl shadow-lg flex flex-col h-full">
          <div class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-bold text-center py-3 rounded-t-2xl">
            📊 Section-wise Scores
          </div>
          <div class="p-4 scrollable">
            <ul class="space-y-2">
              {% for section, section_score in scores.items() %}
              <li class="flex justify-between items-center bg-white/50 p-2 rounded-lg shadow-sm">
                <span class="font-semibold">{{ section }}</span>
                <span class="px-2 py-1 rounded-full font-medium text-white
                  {% if section_score >= 8 %} bg-green-500
                  {% elif section_score >= 5 %} bg-yellow-400 text-gray-800
                  {% else %} bg-red-500 {% endif %}">
                  {{ section_score }}/10
                </span>
              </li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>

      <!-- Middle: Charts -->
      <div class="md:col-span-5 flex flex-col gap-6">
        <div class="glass rounded-2xl shadow-lg flex flex-col items-center p-4">
          <div class="bg-gradient-to-r from-purple-500 via-indigo-500 to-blue-500 text-white font-bold text-center py-2 w-full rounded-t-2xl">
            📈 Overall Match Score
          </div>
          <div class="flex justify-center items-center p-4">
            <img src="data:image/png;base64,{{ piechart }}" alt="Pie Chart" class="chart-img shadow">
          </div>
        </div>

        <div class="glass rounded-2xl shadow-lg flex flex-col items-center p-4">
          <div class="bg-gradient-to-r from-purple-500 via-indigo-500 to-blue-500 text-white font-bold text-center py-2 w-full rounded-t-2xl">
            📊 Matching Chart
          </div>
          <div class="flex justify-center items-center p-4">
            <img src="data:image/png;base64,{{ chart }}" alt="Bar Chart" class="chart-img shadow">
          </div>
        </div>
      </div>

      <!-- Right: LLM Feedback -->
      <div class="md:col-span-4 flex flex-col">
        <div class="glass rounded-2xl shadow-lg flex flex-col h-full">
          <div class="bg-gradient-to-r from-green-400 to-teal-500 text-white font-bold text-center py-3 rounded-t-2xl">
            📝 LLM Feedback
          </div>
          <div class="p-4 scrollable">
            <div id="markdown-feedback" class="prose max-w-none text-gray-800"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const resumeText = `{{ resume_text | tojson | safe }}`;
      const jdText = `{{ jd_text | tojson | safe }}`;

      const feedbackContainer = document.getElementById("markdown-feedback");
      feedbackContainer.innerHTML = "<p><em>Loading feedback...</em></p>";

      fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ resume_text: resumeText, jd_text: jdText })
        })
        .then(response => response.json())
        .then(data => {
          if (data.feedback) {
            feedbackContainer.innerHTML = marked.parse(data.feedback);
          } else {
            feedbackContainer.innerHTML = "<p class='text-red-600 font-semibold'>No feedback available.</p>";
          }
        })
        .catch(err => {
          feedbackContainer.innerHTML = `<p class='text-red-600 font-semibold'>Error: ${err.message}</p>`;
        });
    });
  </script>

</body>
</html>
