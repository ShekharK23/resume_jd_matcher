<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | MatchMatrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icons/favicon.png') }}">
  <style>
    .glass {
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 flex items-center justify-center">

  <div class="flex flex-col md:flex-row bg-white/10 rounded-3xl shadow-2xl overflow-hidden max-w-5xl w-full m-4">

    <!-- Left Panel (Illustration) -->
    <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-indigo-600 via-blue-500 to-purple-500 items-center justify-center p-8">
      <div class="text-center text-white">
        <img src="{{ url_for('static', filename='icons/favicon.png') }}" alt="Login Illustration" class="w-3/4 mx-auto mb-6 drop-shadow-lg">
        <h2 class="text-3xl font-bold mb-2">Welcome Back 👋</h2>
        <p class="text-blue-100">Access your account and continue your journey with MatchMatrix.</p>
      </div>
    </div>

    <!-- Right Panel (Login Form) -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-white glass">
      <div class="w-full max-w-sm">
        <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Login to Your Account</h2>

        <form action="/login" method="POST" class="space-y-5">
          <!-- Username Input -->
          <div>
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username"
              class="w-full px-4 py-2.5 border border-blue-200 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none transition">
          </div>

          <!-- Password Input -->
          <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password"
              class="w-full px-4 py-2.5 border border-blue-200 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none transition">
          </div>

          <!-- Forgot Password -->
          <div class="text-right">
            <a href="/forgot-password" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
          </div>

          <!-- Login Button -->
          <div>
            <button type="submit"
              class="w-full py-2.5 bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-bold rounded-lg shadow-md hover:from-blue-600 hover:to-indigo-600 transform hover:scale-[1.02] transition-all duration-300">
              🚀 Login
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">
          <div class="flex-grow border-t border-gray-300"></div>
          <span class="mx-3 text-gray-400 text-sm">or</span>
          <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <!-- Google Login -->
        <button
          class="w-full py-2.5 border border-gray-300 rounded-lg flex items-center justify-center gap-2 text-gray-700 font-medium hover:bg-gray-100 transition-all duration-200">
          <img src="{{ url_for('static', filename='icons/google.svg') }}" alt="Google" class="w-5 h-5">
          Continue with Google
        </button>

        <!-- Sign Up Link -->
        <div class="mt-6 text-center text-sm">
          <span class="text-gray-500">Don’t have an account?</span>
          <a href="/register" class="text-blue-600 font-semibold hover:underline">Sign Up</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
