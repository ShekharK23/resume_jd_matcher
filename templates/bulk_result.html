<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk Resume Match Results | MatchMatrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .glass {
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 1rem;
    }

    .score-high {
      @apply bg-green-500 text-white font-bold px-3 py-1 rounded-full;
    }

    .score-medium {
      @apply bg-yellow-400 text-gray-800 font-bold px-3 py-1 rounded-full;
    }

    .score-low {
      @apply bg-red-500 text-white font-bold px-3 py-1 rounded-full;
    }

    .feedback-area {
      max-height: 300px;
      overflow-y: auto;
      padding: 1rem;
      margin-top: 0.5rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 0.5rem;
      display: none;
    }

    .btn-match {
      background: linear-gradient(to right, #6366f1, #4f46e5);
      color: white;
      font-weight: bold;
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      transition: all 0.3s;
    }

    .btn-match:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 text-gray-800">

  <div class="container mx-auto py-10 px-4">

    <!-- Header -->
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-bold text-white mb-2">
        <i class="fas fa-user-check text-white"></i> Bulk Resume Match Results
      </h2>
      <p class="text-white/80 mb-4">Review match scores and explanations for each candidate</p>
      <a href="/"
        class="inline-block px-5 py-2 rounded-lg bg-white/30 hover:bg-white/50 text-white font-semibold shadow transition">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <div class="grid gap-6">
      {% for match in matches %}
      <div class="glass p-4 shadow-lg">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3">
          <!-- File name -->
          <h5 class="text-lg font-bold flex items-center gap-2 text-gray-900">
            <i class="fas fa-file-alt text-indigo-500"></i> {{ match.file_name }}
          </h5>

          <!-- Score + Button -->
          <div class="flex items-center gap-3">
            {% if match.score >= 8 %}
            <span class="score-high">{{ match.score }}/10</span>
            {% elif match.score >= 5 %}
            <span class="score-medium">{{ match.score }}/10</span>
            {% else %}
            <span class="score-low">{{ match.score }}/10</span>
            {% endif %}

            <form method="POST" action="/explain_match" class="explain-form"
              data-feedback-id="feedback-{{ loop.index }}">
              <input type="hidden" name="jd_text" value="{{ jd_text }}">
              <input type="hidden" name="resume_content" value="{{ match.content }}">
              <button type="submit" class="btn-match">
                <i class="fas fa-lightbulb"></i> Why Match?
              </button>
            </form>
          </div>
        </div>

        <div class="feedback-area mt-3" id="feedback-{{ loop.index }}"></div>
      </div>
      {% endfor %}
    </div>

  </div>

  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    document.querySelectorAll('.explain-form').forEach((form) => {
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        let feedbackId = form.getAttribute('data-feedback-id');
        let feedbackDiv = document.getElementById(feedbackId);

        feedbackDiv.style.display = 'block';
        feedbackDiv.innerHTML = "<em>Loading explanation...</em>";

        fetch("/explain_match", {
            method: "POST",
            body: new FormData(form)
          })
          .then(res => res.json())
          .then(data => {
            const explanation = data.explanation || "No explanation provided.";
            feedbackDiv.innerHTML = marked.parse(explanation);
          })
          .catch(err => {
            feedbackDiv.innerHTML = "<span class='text-red-600 font-semibold'>Error loading explanation.</span>";
          });
      });
    });
  </script>

</body>

</html>
