<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk Resume Shortlister | MatchMatrix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <style>
    .glass-card {
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 1rem;
    }

    .btn-gradient-primary {
      background: linear-gradient(to right, #6366f1, #4f46e5);
      color: white;
      font-weight: bold;
      border-radius: 0.5rem;
      padding: 0.6rem 1rem;
      transition: all 0.3s;
    }

    .btn-gradient-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 1050;
      justify-content: center;
      align-items: center;
    }

    #loading-overlay .overlay-background {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    #loading-overlay .overlay-content {
      position: relative;
      z-index: 10;
      max-width: 400px;
      width: 90%;
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.querySelector('form');
      form.addEventListener('submit', function () {
        document.getElementById('loading-overlay').style.display = 'flex';
        document.body.classList.add('loading');
        this.querySelector('button[type="submit"]').disabled = true;
      });
    });
  </script>
</head>

<body class="bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 text-gray-800 min-vh-100">

  <div class="container py-10">
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-8">

        <div class="glass-card p-5 shadow-lg">
          <h2 class="text-center mb-5 fw-bold text-gray-900">
            📄 Bulk Resume Shortlister
          </h2>

          <form action="/shortlist" method="POST" enctype="multipart/form-data">

            <!-- Job Description -->
            <div class="mb-4">
              <label for="jd_text" class="form-label fw-semibold">Paste Job Description:</label>
              <textarea class="form-control border border-indigo-300 shadow-sm" id="jd_text" name="jd_text"
                rows="8" placeholder="Enter the job description here..." required></textarea>
            </div>

            <!-- Resume Upload -->
            <div class="mb-4">
              <label for="resume_files" class="form-label fw-semibold">Upload Multiple Resumes (PDF/TXT):</label>
              <input type="file" class="form-control border border-indigo-300 shadow-sm" id="resume_files"
                name="resume_files" accept=".pdf,.txt" multiple required>
              <small class="text-muted">You can select multiple files at once.</small>
            </div>

            <!-- Number of Top Candidates -->
            <div class="mb-4">
              <label for="top_n" class="form-label fw-semibold">Number of Candidates to Shortlist:</label>
              <input type="number" class="form-control border border-indigo-300 shadow-sm" id="top_n" name="top_n"
                min="1" max="50" value="5" required>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn-gradient-primary">
                🚀 Shortlist Resumes
              </button>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Full-page Loading Overlay -->
  <div id="loading-overlay" class="d-flex">
    <div class="overlay-background"></div>
    <div class="overlay-content">
      <div class="progress w-100 mb-4">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-indigo-600"
          role="progressbar" style="width: 100%"></div>
      </div>
      <div class="fs-5 mb-1 text-gray-800">Analyzing resumes and job description,</div>
      <div class="fs-5 text-gray-800">Please wait...</div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
